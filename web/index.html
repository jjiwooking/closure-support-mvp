<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다음걸음</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="login-view" class="view">
    <div class="login-card">
      <h1>다음걸음</h1>
      <p>상호명 또는 닉네임을 입력하고 시작하세요. 비밀번호는 없으며, 같은 이름으로 다시 오면 이전 기록이 이어집니다.</p>
      <form id="login-form">
        <input type="text" id="login-name" placeholder="상호명 / 닉네임" autocomplete="username" required>
        <button type="submit">시작하기</button>
      </form>
      <p id="login-error" class="error" hidden></p>
      <p class="api-hint">API 서버(<code>uvicorn api:app --reload --port 8000</code>)가 먼저 떠 있어야 합니다.</p>
    </div>
  </section>

  <section id="app-view" class="view" hidden>
    <aside class="sidebar">
      <h1>다음걸음</h1>
      <p class="user-name" id="user-name"></p>
      <button id="logout-btn" class="secondary full-width">다른 이름으로 시작</button>
      <hr>
      <nav>
        <button class="nav-btn" data-page="dashboard">폐업 진행 상황</button>
        <h3>단계별 코칭</h3>
        <button class="nav-btn" data-page="stage:준비">폐업 준비</button>
        <button class="nav-btn" data-page="stage:진행">폐업 진행</button>
        <button class="nav-btn" data-page="stage:후">폐업 후</button>
        <h3>기타</h3>
        <button class="nav-btn" data-page="policies">지원정책</button>
        <button class="nav-btn" data-page="equipment">중고품 관리</button>
        <button class="nav-btn" data-page="marketplace">설비 매칭</button>
      </nav>
    </aside>
    <main id="main-content"></main>
  </section>

  <script src="app.js"></script>
</body>
</html>
